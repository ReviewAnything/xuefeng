name: Deploy H5 (GitHub Pages)

# 把前端构建成 H5 静态站并部署到 GitHub Pages（公开 demo）。
#
# 首次使用：仓库 Settings → Pages → Source 选 "GitHub Actions"。
# 想让 demo 连上真实后端：Settings → Secrets and variables → Actions → Variables
# 增加一个 XUEFENG_API_BASE（形如 https://xuefeng-api.onrender.com）。
# 留空则 demo 只跑本地内容（诊断/专业图谱/资源可用；需要后端的核验会提示未连接）。
#
# 默认手动触发；如需「推送到 master 自动部署」，取消下方 push 段注释。
on:
  workflow_dispatch:
  # push:
  #   branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（锁定版本，保证可复现）
        run: npm ci

      - name: 前端测试（决策引擎 + 志愿表工具 + SFC/管理端模板编译）
        run: npm test

      - name: 构建 H5（hash 路由 + 相对路径，适配 Pages 子路径）
        env:
          VITE_API_BASE: ${{ vars.XUEFENG_API_BASE }}
        run: npm run build:h5

      # 变量存在时把后端地址写进 index.html（部署后不重新构建也能改）
      - name: 注入后端地址
        if: vars.XUEFENG_API_BASE != ''
        working-directory: frontend/dist/build/h5
        env:
          XUEFENG_API_BASE: ${{ vars.XUEFENG_API_BASE }}
        run: |
          sed -i "s|<head>|<head><script>window.__XUEFENG_API__='${XUEFENG_API_BASE}';</script>|" index.html
          grep -c "__XUEFENG_API__" index.html

      - name: 列出产物（便于排查路径）
        run: ls -R dist | head -40

      # 产物自检：构建「成功」但产出空壳/丢了入口是常见事故，这里硬性校验
      - name: 产物自检（入口存在 + JS 非空）
        working-directory: frontend/dist/build/h5
        env:
          XUEFENG_API_BASE: ${{ vars.XUEFENG_API_BASE }}
        run: |
          set -e
          test -f index.html || { echo "缺少 index.html"; exit 1; }
          grep -q '<div id="app"' index.html || { echo "index.html 缺少 #app 挂载点"; exit 1; }
          js_count=$(find . -name '*.js' -size +1k | wc -l | tr -d ' ')
          echo "js bundles: $js_count"
          test "$js_count" -ge 1 || { echo "未产出有效 JS 包"; exit 1; }
          if [ -n "${XUEFENG_API_BASE:-}" ]; then
            grep -q '__XUEFENG_API__' index.html || { echo "后端地址注入失败"; exit 1; }
          fi
          du -sh .

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/build/h5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
