name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install & test
        run: |
          pip install -r requirements.txt pytest
          pytest -q
      - name: Validate current data version (no blocking issues)
        run: |
          python -c "from db import init_db; init_db()" && \
          python scripts/manage_data.py validate "$(python -c "import sys; sys.path.insert(0,'.'); from db import repository as repo; print(repo.active_year())")"

  frontend-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Engine unit test (zero-dep)
        run: node tests/engine.test.mjs
      - name: SFC template compile check (zero-dep)
        run: node tests/template.test.mjs
      - name: "Single lockfile guard - npm only"
        run: |
          node -e "
          const fs=require('fs');
          const files=['package-lock.json','pnpm-lock.yaml','yarn.lock','bun.lockb'].filter(f=>fs.existsSync(f));
          if(files.length!==1){console.error('lockfile 必须唯一（本项目用 npm），当前存在:'+files.join(', '));process.exit(1);}
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const a=Object.keys(pkg.dependencies||{}).sort().join(',');
          const b=Object.keys((lock.packages&&lock.packages['']&&lock.packages[''].dependencies)||{}).sort().join(',');
          if(a!==b){console.error('package.json 与 package-lock.json 依赖不一致:\n  package.json: '+a+'\n  lock: '+b);process.exit(1);}
          console.log('ok: 唯一 npm lockfile 且与 package.json 同步');
          "

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build H5 (validates wot-design-uni integration)
        run: npm run build:h5

  admin-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check admin console
        run: node --check backend/admin/app.js
      - name: Reject self-closing custom tags (Vue in-DOM template pitfall)
        run: |
          node -e "const s=require('fs').readFileSync('backend/admin/index.html','utf8');
          const m=s.match(/<(?:el|app)-[a-z0-9-]+[^<>]*\/>/g);
          if(m){console.error('自闭合自定义标签会被浏览器当成开标签并吞掉后续兄弟节点（曾导致登录页只剩账号框）:');
          console.error(m.slice(0,5).join('\n'));process.exit(1);}
          console.log('ok: 无自闭合自定义标签');"
      - name: Ensure vendor assets are present
        run: |
          test -f backend/admin/vendor/vue.global.prod.js
          test -f backend/admin/vendor/index.full.min.js
          test -f backend/admin/vendor/index.css

